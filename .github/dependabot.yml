version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      # FFmpeg WASM: только v0.10.x, v0.11+ ломает сборку (CLAUDE.md)
      - dependency-name: "@ffmpeg/ffmpeg"
      - dependency-name: "@ffmpeg/core"
      # мажоры ESLint и Tailwind v4 — breaking changes, проект на ESLint 10 (flat config) / Tailwind v3
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # мажоры обновляем вручную
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      prod-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-deps:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
